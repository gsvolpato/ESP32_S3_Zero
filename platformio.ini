[platformio]
build_cache_dir = .pio/build_cache

[env:esp32s3]
platform = espressif32
board = adafruit_qtpy_esp32s3_n4r2
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=2
    -D TFT_SCLK=1
    -D TFT_CS=-1
    -D TFT_DC=4
    -D TFT_RST=3
    -D TFT_BL=5
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
                -D SMOOTH_FONT=1
                -D USE_HSPI_PORT=1
                
lib_deps = 
    adafruit/Adafruit NeoPixel
    bodmer/TFT_eSPI @ ^2.5.0
    adafruit/Adafruit MPU6050
    adafruit/Adafruit_VL53L0X @ ^1.2.4
